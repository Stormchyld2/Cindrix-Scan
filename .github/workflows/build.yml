name: Build Scan APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: if these repository secrets exist, the APK is signed with your own
      # release key. If they do not, the keystore committed in app/ is used.
      - name: Use release keystore if provided
        env:
          KEYSTORE_B64: ${{ secrets.SCAN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SCAN_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          SCAN_KEYSTORE_PASSWORD: ${{ secrets.SCAN_KEYSTORE_PASSWORD }}
          SCAN_KEY_ALIAS: ${{ secrets.SCAN_KEY_ALIAS }}
          SCAN_KEY_PASSWORD: ${{ secrets.SCAN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CindrixScan-${VERSION}-android.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: CindrixScan-android
          path: dist/*.apk
